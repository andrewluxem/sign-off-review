<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">sign-off-review</title>
<desc id="d">Three panels from the repo's strategy-01 eval, a fictional memo. 1, the memo's Summary says Consolidation saves $1.4M a year from FY2028, but its Annual savings table totals $1.1M. 2, the stored review lists it under Numbers that do not tie: Annual saving from FY2028, $1.4M (Summary) vs $1.1M (Annual savings table, Total), difference $0.3M, and raises finding 1 as a Blocker owned by the Lead. 3, the review's verdict is Return, as references/severity.md requires: 1. Any open Blocker: Return. 2. Any row in Numbers that do not tie: Return. The stdlib validator scripts/check_report.py prints ok for the review.</desc>
<style>
.serif{font-family:Georgia,"Times New Roman",serif}
.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.lab{font-size:10px;letter-spacing:1.8px;font-weight:600}
.cap{font-size:11.5px;fill:#8b9096}
.hl{fill:none;stroke-width:1.5;opacity:0}
.h1{animation:h1 12s infinite}
.h2{animation:h2 12s infinite}
.h3{animation:h3 12s infinite}
.r1{animation:r1 12s infinite}
.r2{animation:r2 12s infinite}
.rb{animation:rb 12s infinite}
.rc{animation:rc 12s infinite}
.rd{animation:rd 12s infinite}
.re{animation:re 12s infinite}
.rf{animation:rf 12s infinite}
.rg{animation:rg 12s infinite}
.rh{animation:rh 12s infinite}
@keyframes h1{0%,16.7%{opacity:0}18.7%,42.4%{opacity:1}44.1%,100%{opacity:0}}
@keyframes h2{0%,16.7%,18.7%,44.1%{opacity:0}45.8%,67.8%{opacity:1}69.5%,100%{opacity:0}}
@keyframes h3{0%,16.7%,18.7%,69.5%{opacity:0}71.2%,94.9%{opacity:1}96.6%,100%{opacity:0}}
@keyframes r1{0%,16.7%{opacity:1}18.7%,20.4%{opacity:0}22.1%,100%{opacity:1}}
@keyframes r2{0%,16.7%{opacity:1}18.7%,28.9%{opacity:0}30.6%,100%{opacity:1}}
@keyframes rb{0%,16.7%{opacity:1}18.7%,45%{opacity:0}46.6%,100%{opacity:1}}
@keyframes rc{0%,16.7%{opacity:1}18.7%,49.2%{opacity:0}50.9%,100%{opacity:1}}
@keyframes rd{0%,16.7%{opacity:1}18.7%,56%{opacity:0}57.7%,100%{opacity:1}}
@keyframes re{0%,16.7%{opacity:1}18.7%,61.9%{opacity:0}63.6%,100%{opacity:1}}
@keyframes rf{0%,16.7%{opacity:1}18.7%,72.1%{opacity:0}73.7%,100%{opacity:1}}
@keyframes rg{0%,16.7%{opacity:1}18.7%,78%{opacity:0}79.7%,100%{opacity:1}}
@keyframes rh{0%,16.7%{opacity:1}18.7%,86.5%{opacity:0}88.1%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="300" fill="#141618"/>

<text x="32" y="50" class="serif" font-size="28" fill="#e4dfd4">sign-off-review</text>
<text x="236" y="50" class="sans" font-size="13.5" fill="#a9adb2">Agent skill: five-seat sign-off review with number tie-out</text>

<g>
<text x="32" y="88" class="sans lab" fill="#a39bbd">1 · A DRAFT MEMO</text>
<rect x="32" y="98" width="226" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h1" x="32" y="98" width="226" height="152" rx="3" stroke="#a39bbd"/>
<text x="44" y="115" class="mono" font-size="10" fill="#8b9096">evals/inputs/strategy-01-memo.md</text>
<line x1="33" y1="123" x2="257" y2="123" stroke="#2e3237"/>
<g class="r1"><text x="44" y="142" class="sans" font-size="10" fill="#a9adb2" font-weight="700">Summary</text><text x="44" y="158" class="serif" font-size="11" fill="#e4dfd4">Consolidation saves</text><text x="148" y="158" class="serif" font-size="11" fill="#e4dfd4">$1.4M</text><text x="186" y="158" class="serif" font-size="11" fill="#e4dfd4">a year</text><text x="44" y="172" class="serif" font-size="11" fill="#e4dfd4">from FY2028</text><g fill="#3d4248"><rect x="112" y="168" width="134" height="3"/><rect x="44" y="178" width="190" height="3"/></g></g>
<g class="r2"><text x="44" y="199" class="sans" font-size="10" fill="#a9adb2" font-weight="700">Annual savings from FY2028</text><g fill="#3d4248"><rect x="44" y="204" width="150" height="3"/><rect x="44" y="210" width="138" height="3"/><rect x="44" y="216" width="120" height="3"/><rect x="44" y="222" width="160" height="3"/></g><line x1="44" y1="227.5" x2="246" y2="227.5" stroke="#2e3237"/><text x="44" y="242" class="sans" font-size="10" fill="#e4dfd4" font-weight="700">Total</text><text x="246" y="242" class="mono" font-size="10" fill="#e4dfd4" font-weight="700" text-anchor="end">$1.1M</text></g>
<g class="rc"><rect x="144.5" y="146" width="37.8" height="16" fill="none" stroke="#c8963e" stroke-dasharray="3 2"/><rect x="211.5" y="230.5" width="38" height="17" fill="none" stroke="#c8963e" stroke-dasharray="3 2"/></g>
<text x="32" y="272" class="sans cap">The summary says $1.4M. The table, $1.1M.</text>
</g>

<g>
<text x="278" y="88" class="sans lab" fill="#c8963e">2 · THE REVIEW TIES IT OUT</text>
<rect x="278" y="98" width="290" height="152" rx="3" fill="#17191c" stroke="#2e3237"/>
<rect class="hl h2" x="278" y="98" width="290" height="152" rx="3" stroke="#c8963e"/>
<text x="290" y="115" class="mono" font-size="10" fill="#8b9096">strategy-01-memo.review-2026-10-24.md</text>
<line x1="279" y1="123" x2="567" y2="123" stroke="#2e3237"/>
<g class="rb"><text x="290" y="141" class="mono" font-size="10" fill="#a9adb2">## Numbers that do not tie</text></g>
<g class="rc"><text x="290" y="160" class="sans" font-size="10.5" fill="#e4dfd4">Annual saving from FY2028</text><text x="290" y="176" class="mono" font-size="10" fill="#e4dfd4">$1.4M (Summary)</text><text x="290" y="190" class="mono" font-size="10" fill="#e4dfd4">$1.1M (Annual savings table, Total)</text></g>
<g class="rd"><text x="290" y="206" class="mono" font-size="10" fill="#8b9096">Difference</text><text x="362" y="206" class="mono" font-size="10" fill="#c8963e" font-weight="700">$0.3M</text></g>
<g class="re"><line x1="290" y1="217.5" x2="556" y2="217.5" stroke="#2e3237"/><text x="290" y="235" class="mono" font-size="10" fill="#e4dfd4">1</text><text x="308" y="235" class="mono" font-size="10" fill="#c8963e" font-weight="700">Blocker</text><text x="366" y="235" class="mono" font-size="10" fill="#e4dfd4">Lead</text></g>
<text x="278" y="272" class="sans cap">One figure, two values: a Blocker.</text>
</g>

<g>
<text x="588" y="88" class="sans lab" fill="#93ad8c">3 · RETURN, BY RULE</text>
<rect x="588" y="98" width="280" height="152" rx="3" fill="#17191c" stroke="#2e3237"/>
<rect class="hl h3" x="588" y="98" width="280" height="152" rx="3" stroke="#93ad8c"/>
<text x="600" y="115" class="mono" font-size="10" fill="#8b9096">strategy-01-memo.review-2026-10-24.md:2</text>
<line x1="589" y1="123" x2="867" y2="123" stroke="#2e3237"/>
<g class="rf"><text x="600" y="143" class="mono" font-size="13" fill="#e4dfd4" font-weight="700">Verdict: <tspan fill="#c8963e">Return</tspan></text></g>
<g class="rg"><text x="600" y="163" class="mono" font-size="10" fill="#8b9096">references/severity.md</text><text x="600" y="178" class="mono" font-size="10" fill="#e4dfd4">1. Any open Blocker: Return.</text><text x="600" y="192" class="mono" font-size="10" fill="#e4dfd4">2. Any row in "Numbers that do not tie":</text><text x="600" y="206" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">   Return.</text></g>
<g class="rh"><text x="600" y="225" class="mono" font-size="10" fill="#8b9096">scripts/check_report.py</text><text x="600" y="240" class="mono" font-size="10" fill="#e4dfd4">strategy-01-memo.review-2026-10-24.md: <tspan fill="#93ad8c">ok</tspan></text></g>
<text x="588" y="272" class="sans" font-size="11.5" fill="#93ad8c">An open Blocker can only end in Return.</text>
</g>
</svg>
